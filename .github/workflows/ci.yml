# Chapter 31 of Book 3: closes a real, disclosed gap this repo's own
# README has claimed was covered since chapter 11 of this book, a
# live/integration-tier CI job that never actually existed until now.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/orchestration -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: fast-tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reorder_app
          POSTGRES_PASSWORD: reorder_app
          POSTGRES_DB: reorder_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reorder_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reorder_app:reorder_app@localhost:5432/reorder_app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest tests/integration -v
