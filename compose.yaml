services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: reorder_app
      POSTGRES_PASSWORD: reorder_app
      POSTGRES_DB: reorder_app
    ports:
      # Remapped from Postgres' standard 5432: this dev machine already
      # has another project's Postgres bound to that port. A GitHub
      # Actions runner has no such conflict and would use 5432 directly,
      # same reasoning Book 2's compose.yaml used for Neo4j.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reorder_app"]
      interval: 2s
      timeout: 5s
      retries: 10
