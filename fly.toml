# Chapter 10: reorder-app's first real cloud environment. Written by
# hand, not generated by `flyctl launch`'s wizard, so every line here
# is something this chapter actually explains, not something a scanner
# guessed at. Chapter 9's worker joins here too, a second process group
# in the same app, so the full stack chapters 4-9 built is live, not
# just the HTTP-facing half of it.

app = "reorder-app-book3"
primary_region = "jnb"

[build]

[env]
  AUTH0_DOMAIN = "dev-a73uyb0st1rx7y8q.eu.auth0.com"
  AUTH0_AUDIENCE = "https://reorder-app.dev/api"

[processes]
  app = "python scripts/run_server.py"
  worker = "python scripts/run_worker.py"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/docs"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  # 256mb, the cheapest tier, was the first real thing tried here. It
  # OOM-killed the process mid-request, confirmed live in `fly logs`
  # ("Process appears to have been OOM killed!"), not guessed at from a
  # sizing chart. This app's own dependency graph (LangGraph, psycopg,
  # everything reliable-agents-labs pulls in transitively) needs more
  # than the cheapest default actually offers.
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"
